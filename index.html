  function getKey(modality, providerKey) { return (STATE.secrets[modality] && STATE.secrets[modality][providerKey]) || ''; }
  function getModel(modality, providerKey, registry) {
    return (STATE.config.models && STATE.config.models[modality] && STATE.config.models[modality][providerKey]) || registry[providerKey]?.default;
  }
  function setKey(modality, providerKey, key, model) {
    STATE.secrets[modality] = STATE.secrets[modality] || {};
    if (key) STATE.secrets[modality][providerKey] = key;
    STATE.config.models = STATE.config.models || emptyKeys();
    STATE.config.models[modality] = STATE.config.models[modality] || {};
    if (model) STATE.config.models[modality][providerKey] = model;
    saveConfig();
  }
  function forgetKeys() { STATE.secrets = emptyKeys(); STATE.config.remember_keys = false; saveConfig(); renderAiChip(); }

  // ─── DOM helpers ────────────────────────────────────────────────────
  function $(s, root) { return (root || document).querySelector(s); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

  // ─── AI tier ────────────────────────────────────────────────────────
  function aiTier() { return STATE.config.ai_tier || 'T0'; }
  function activeTextProvider() { return STATE.config.text_provider || 'anthropic'; }

  function renderAiChip() {
    const chip = $('#fk-ai-chip');
    if (!chip) return;
    const txt = $('#fk-ai-chip-text');
    chip.classList.remove('fk-chip-live', 'fk-chip-loading', 'fk-chip-warn');
    const tier = aiTier();
    if (tier === 'T0') { txt.textContent = 'T0 · off'; }
    else if (tier === 'T2') {
      if (STATE.ai.ready) { txt.textContent = 'T2 ' + (WEBLLM_MODELS[STATE.config.webllm_model || DEFAULT_MODEL]?.label.split(' · ')[0] || '') + ' · ready'; chip.classList.add('fk-chip-live'); }
      else if (STATE.ai.loading) { txt.textContent = 'T2 loading ' + Math.round(STATE.ai.progress) + '%'; chip.classList.add('fk-chip-loading'); }
      else { txt.textContent = 'T2 · click to load'; chip.classList.add('fk-chip-warn'); }
    } else if (tier === 'T3') {
      const p = activeTextProvider();
      if (getKey('text', p)) { txt.textContent = 'T3 ' + (TEXT_PROVIDERS[p]?.label.split(' ')[0] || 'BYOK') + ' · active'; chip.classList.add('fk-chip-live'); }
      else { txt.textContent = 'T3 · no key set'; chip.classList.add('fk-chip-warn'); }
    }
  }

  async function loadWebLLM(modelKey) {
    if (STATE.ai.loading) return;
    const key = modelKey || STATE.config.webllm_model || DEFAULT_MODEL;
    const model = WEBLLM_MODELS[key];
    if (!model) { console.error('fall-kit: unknown model', key); return; }
    if (STATE.ai.ready && STATE.ai.model === model.id) return;
    STATE.ai.loading = true; STATE.ai.progress = 0; renderAiChip();
    notify('Loading WebLLM · ' + model.label + ' · ' + model.size + ' first time', 'info');
    try {
      const { CreateMLCEngine } = await import('https://esm.run/@mlc-ai/web-llm@0.2.79');
      const engine = await CreateMLCEngine(model.id, {
        initProgressCallback: p => { STATE.ai.progress = (p.progress || 0) * 100; renderAiChip(); }
      });
      STATE.ai.engine = engine; STATE.ai.model = model.id; STATE.ai.ready = true; STATE.ai.loading = false;
      STATE.config.webllm_model = key; saveConfig(); renderAiChip();
      notify('WebLLM ready · sovereign mode · ' + model.label.split(' · ')[0], 'ok');
    } catch (e) {
      console.error('fall-kit: WebLLM load failed', e);
      STATE.ai.loading = false; renderAiChip();
      notify('WebLLM load failed · ' + e.message, 'err');
    }
  }

  // ═══════════════════════ TEXT · aiComplete · aiChat ═══════════════
  // One way to ask every text provider: the system prompt first and the same each call (so a provider can reuse its
  // reading of it), then the conversation, which only ever grows. Pure pieces (requestOf, textOf, usageOf) are exposed
  // on FallKit for tests; nothing pure here touches the network.
  const isObj = (x) => x !== null && typeof x === 'object' && !Array.isArray(x);
  const count = (x) => (Number.isInteger(x) && x >= 0 ? x : 0);
  /** Claude models from 5.x think before they answer: room for that, and a light effort for an assistant's reply */
  const THINKS = (model) => /^claude-(?:opus|sonnet|haiku|fable|mythos)-5/.test(model);
  /** Claude models with a server-side fallback when a request is declined (Haiku has none) */
  const FALLS_BACK = (model) => /^claude-(?:opus|sonnet|fable)-5/.test(model);
  /** a message's words, whatever shape a provider keeps it in */
  function wordsOf(m) {
    if (!isObj(m)) return '';
    if (typeof m.content === 'string') return m.content;
    if (Array.isArray(m.content)) return m.content.filter((b) => isObj(b) && b.type === 'text' && typeof b.text === 'string').map((b) => b.text).join('\n');
    return '';
  }
  /**
   * The request a text provider is sent: { url, headers, body } for type (anthropic | openai | google | openai_compat |
   * cohere | hf_inference). messages: [{ role: 'user' | 'assistant', content }]. Pure: the key is placed, never kept.
   */
  function requestOf(type, opts) {
    const { model, key, system, messages, maxTokens, url } = opts;
    const max = Number.isInteger(maxTokens) && maxTokens > 0 ? maxTokens : 600;
    const plain = messages.map((m) => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: wordsOf(m) }));
    if (type === 'anthropic') {
      const headers = { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' };
      const body = { model, max_tokens: THINKS(model) ? Math.max(max * 4, 4000) : max, system: [{ type: 'text', text: system, cache_control: { type: 'ephemeral' } }],
        messages: messages.map((m) => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content })) };
      if (THINKS(model)) body.output_config = { effort: 'low' };
      if (FALLS_BACK(model)) { headers['anthropic-beta'] = 'server-side-fallback-2026-07-01'; body.fallbacks = 'default'; }
      return { url: 'https://api.anthropic.com/v1/messages', headers, body };
    }
    if (type === 'openai') return { url: 'https://api.openai.com/v1/chat/completions', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_completion_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    if (type === 'google') return { url: 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent', headers: { 'content-type': 'application/json', 'x-goog-api-key': key },
      body: { systemInstruction: { parts: [{ text: system }] }, contents: plain.map((m) => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] })), generationConfig: { maxOutputTokens: max } } };
    if (type === 'cohere') return { url: 'https://api.cohere.com/v2/chat', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    if (type === 'hf_inference') return { url: 'https://api-inference.huggingface.co/models/' + model + '/v1/chat/completions', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    if (type === 'openai_compat') return { url: url, headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    return null;
  }
  /** the answer's words from a provider's reply, or null when it declined or said nothing. Pure. */
  function textOf(type, j) {
    if (!isObj(j)) return null;
    let t = '';
    if (type === 'anthropic') { if (j.stop_reason === 'refusal' || !Array.isArray(j.content)) return null; t = wordsOf({ content: j.content }); }
    else if (type === 'google') { const c = Array.isArray(j.candidates) ? j.candidates[0] : null; t = c && isObj(c.content) && Array.isArray(c.content.parts) ? c.content.parts.map((p) => (isObj(p) && typeof p.text === 'string' ? p.text : '')).join('') : ''; }
    else if (type === 'cohere') { t = isObj(j.message) && Array.isArray(j.message.content) ? wordsOf({ content: j.message.content.map((b) => Object.assign({ type: 'text' }, b)) }) : ''; }
    else { const c = Array.isArray(j.choices) ? j.choices[0] : null; t = c && isObj(c.message) && typeof c.message.content === 'string' ? c.message.content : ''; }
    t = t.trim();
    return t ? t : null;
  }
  /** what a call used, read from a provider's own usage record: { read, recycled, written, out }. Pure. */
  function usageOf(type, j) {
    const u = isObj(j) ? (type === 'google' ? j.usageMetadata : type === 'cohere' && isObj(j.usage) ? j.usage.tokens : j.usage) : null;
    if (!isObj(u)) return { read: 0, recycled: 0, written: 0, out: 0 };
    if (type === 'anthropic') { const recycled = count(u.cache_read_input_tokens), written = count(u.cache_creation_input_tokens); return { read: count(u.input_tokens) + recycled + written, recycled, written, out: count(u.output_tokens) }; }
    if (type === 'google') { const read = count(u.promptTokenCount); return { read, recycled: Math.min(read, count(u.cachedContentTokenCount)), written: 0, out: count(u.candidatesTokenCount) + count(u.thoughtsTokenCount) }; }
    if (type === 'cohere') return { read: count(u.input_tokens), recycled: 0, written: 0, out: count(u.output_tokens) };
    const read = count(u.prompt_tokens), d = isObj(u.prompt_tokens_details) ? u.prompt_tokens_details : {};
    return { read, recycled: Math.min(read, count(d.cached_tokens)), written: 0, out: count(u.completion_tokens) };
  }

  async function aiComplete(systemPrompt, userMsg, maxTokens) {
    const r = await aiChat(systemPrompt, [], userMsg, maxTokens);
    return r ? r.text : null;
  }
  /**
   * One turn of a conversation: the system prompt, the history so far (unchanged), and the user's words. → { text,
   * assistant } — the caller appends { role: 'user', content: userMsg } and `assistant` to its history (assistant is the
   * reply as the provider gave it, so a provider that checks its own earlier turns sees them unchanged) — or null when no
   * tier can answer.
   */
  async function aiChat(systemPrompt, history, userMsg, maxTokens) {
    maxTokens = maxTokens || 600;
    const messages = (Array.isArray(history) ? history : []).concat([{ role: 'user', content: String(userMsg == null ? '' : userMsg) }]);
    const tier = aiTier();
    if (tier === 'T2' && STATE.ai.ready && STATE.ai.engine) {
      const r = await STATE.ai.engine.chat.completions.create({
        messages: [{ role: 'system', content: systemPrompt }].concat(messages.map((m) => ({ role: m.role, content: wordsOf(m) }))), max_tokens: maxTokens,
      });
      const text = r.choices[0].message.content;
      STATE.lastUsage = Object.assign({ provider: 'webllm' }, usageOf('openai', r));
      return { text: text, assistant: { role: 'assistant', content: text } };
    }
    if (tier === 'T3') {
      const p = activeTextProvider(); const key = getKey('text', p);
      if (!key) return null;
      return await textCall(p, systemPrompt, messages, maxTokens);
    }
    return null;
  }

  async function textCall(providerKey, sys, messages, maxTokens) {
    const p = TEXT_PROVIDERS[providerKey];
    const model = getModel('text', providerKey, TEXT_PROVIDERS);
    const req = requestOf(p.type, { model, key: getKey('text', providerKey), system: sys, messages, maxTokens, url: p.url });
    if (!req) throw new Error('unknown text provider type: ' + p.type);
    const r = await fetch(req.url, { method: 'POST', headers: req.headers, body: JSON.stringify(req.body) });
    if (!r.ok) throw new Error(p.label + ' ' + r.status);
    const j = await r.json();
    STATE.lastUsage = Object.assign({ provider: providerKey, model: model }, usageOf(p.type, j));
    const text = textOf(p.type, j);
    if (text === null) return null;
    return { text: text, assistant: p.type === 'anthropic' ? { role: 'assistant', content: j.content } : { role: 'assistant', content: text } };
  }

  // ═══════════════════════ ASK · about this page ═════════════════════
  // The kit's own use of the brain, so the chip is useful in any build, wired or not: a question about the page, answered
  // from the page's own words. The opening is read once per talk and sent byte-identical every question, so a provider
  // that caches recycles it; a talk starts afresh after MAX_ASKS questions or when the person starts again.
  const PAGE_MAX = 12000, MAX_ASKS = 20;
  const ASK_OPENING = 'You are the helper inside a web page. Answer questions about this page and how to use it, briefly and in plain words. Use only what the page says below; when it does not say, say so.';
  /** the opening for questions about a page: who the helper is, then the page's title, description and text. Pure. */
  function pageOpening(page) {
    const p = isObj(page) ? page : {};
    const line = (s, n) => (typeof s === 'string' ? s : '').replace(/\s+/g, ' ').trim().slice(0, n);
    const text = (typeof p.text === 'string' ? p.text : '').replace(/[ \t\r\f\v]+/g, ' ').replace(/ *\n[\s]*/g, '\n').trim().slice(0, PAGE_MAX);
    const about = line(p.description, 400);
    return ASK_OPENING + '\n\nPAGE: ' + (line(p.title, 200) || '(no title)') + '\n' + (about ? 'ABOUT: ' + about + '\n' : '') + 'TEXT:\n' + text;
  }
  function readPage() {   // the page as its reader has it, without the kit's own chip, panel and code
    const d = document.querySelector('meta[name="description"]');
    const body = document.body ? document.body.cloneNode(true) : null;
    if (body) {
      body.querySelectorAll('#fk-modal-bg, #fk-ai-chip, #fk-toast, script, style, noscript, template').forEach((e) => e.remove());
      body.querySelectorAll('td, th').forEach((e) => e.append(' | '));   // keep cells and blocks apart, as a reader sees them
      body.querySelectorAll('p, div, li, tr, h1, h2, h3, h4, h5, h6, br, pre, dt, dd, figcaption, blockquote, section, article, header, footer, nav, label, button, option').forEach((e) => e.append('\n'));
    }
    return { title: document.title, description: d ? d.getAttribute('content') : '', text: body ? body.textContent : '' };
  }
  async function askPage(question) {
    const q = String(question == null ? '' : question).trim();
    if (!q) return { text: null, why: 'Type a question first.' };
    if (aiTier() === 'T0') return { text: null, why: 'AI is off. Pick T2 (a model in your browser) or T3 (your own key) below, press Save, then ask.' };
    const t = STATE.ask;
    if (!t.opening || t.talk.length >= MAX_ASKS * 2) { t.opening = pageOpening(readPage()); t.talk = []; }
    const r = await aiChat(t.opening, t.talk, q, 600);
    if (!r) return { text: null, why: aiTier() === 'T2' ? 'The in-browser model is not loaded yet: press Load model below.' : 'No key is set for this provider: add one below and press Save.' };
    t.talk.push({ role: 'user', content: q }, r.assistant);
    t.last = r.text;
    return { text: r.text, why: null };
  }

  // ═══════════════════════ IMAGE · aiImage ═══════════════════════════
  async function aiImage(prompt, opts) {
    opts = opts || {};
    const providerKey = opts.provider || STATE.config.image_provider || 'fal';
    const p = IMAGE_PROVIDERS[providerKey];
    const key = getKey('image', providerKey);
    if (!key) return null;
    const model = opts.model || getModel('image', providerKey, IMAGE_PROVIDERS);

    if (p.type === 'fal') {
      const r = await fetch('https://fal.run/' + model, {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Key ' + key },
        body: JSON.stringify({ prompt, image_size: opts.size || 'landscape_4_3', num_inference_steps: opts.steps || 4 }),
      });
      if (!r.ok) throw new Error('fal ' + r.status);
      const j = await r.json();
      return { url: j.images?.[0]?.url || j.image?.url, raw: j };
    }
    if (p.type === 'hf_image') {
      const r = await fetch('https://api-inference.huggingface.co/models/' + model, {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ inputs: prompt }),
      });
      if (!r.ok) throw new Error('HF ' + r.status);
      const blob = await r.blob();
      return { url: URL.createObjectURL(blob), blob };
    }
    if (p.type === 'replicate') {
      const r = await fetch('https://api.replicate.com/v1/predictions', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Token ' + key, 'Prefer': 'wait' },
        body: JSON.stringify({ version: model, input: { prompt, num_outputs: 1 } }),
      });
      if (!r.ok) throw new Error('Replicate ' + r.status);
      const j = await r.json();
      return { url: Array.isArray(j.output) ? j.output[0] : j.output, raw: j };
    }
    if (p.type === 'openai_image') {
      const r = await fetch('https://api.openai.com/v1/images/generations', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model, prompt, n: 1, size: opts.size || '1024x1024' }),
      });
      if (!r.ok) throw new Error('OpenAI ' + r.status);
      const j = await r.json();
      return { url: j.data[0].url, raw: j };
    }
    if (p.type === 'openai_image_compat') {
      const r = await fetch(p.url, {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model, prompt, n: 1 }),
      });
      if (!r.ok) throw new Error(p.label + ' ' + r.status);
      const j = await r.json();
      return { url: j.data[0].url, raw: j };
    }
    if (p.type === 'google_image') {
      const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + model + ':predict?key=' + encodeURIComponent(key), {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ instances: [{ prompt }], parameters: { sampleCount: 1 } }),
      });
      if (!r.ok) throw new Error('Google Imagen ' + r.status);
      const j = await r.json();
      return { url: 'data:image/png;base64,' + j.predictions[0].bytesBase64Encoded, raw: j };
    }
    if (p.type === 'ideogram') {
      const r = await fetch('https://api.ideogram.ai/generate', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Api-Key': key },
        body: JSON.stringify({ image_request: { prompt, model, aspect_ratio: opts.size || 'ASPECT_16_9' } }),
      });
      if (!r.ok) throw new Error('Ideogram ' + r.status);
      const j = await r.json();
      return { url: j.data[0].url, raw: j };
    }
    if (p.type === 'leonardo') {
      const r = await fetch('https://cloud.leonardo.ai/api/rest/v1/generations', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ prompt, modelId: model, num_images: 1, width: 1024, height: 576 }),
      });
      if (!r.ok) throw new Error('Leonardo ' + r.status);
      const j = await r.json();
      return { id: j.sdGenerationJob.generationId, raw: j, note: 'poll /generations/:id for URL' };
    }
    throw new Error('unknown image provider type: ' + p.type);
  }

  // ═══════════════════════ VIDEO · aiVideo ═══════════════════════════
  async function aiVideo(prompt, opts) {
    opts = opts || {};
    const providerKey = opts.provider || STATE.config.video_provider || 'fal';
    const p = VIDEO_PROVIDERS[providerKey];
    const key = getKey('video', providerKey);
    if (!key) return null;
    const model = opts.model || getModel('video', providerKey, VIDEO_PROVIDERS);

    if (p.type === 'fal') {
      const r = await fetch('https://fal.run/' + model, {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Key ' + key },
        body: JSON.stringify({ prompt, duration: opts.duration || '5s', aspect_ratio: opts.aspect || '16:9' }),
      });
      if (!r.ok) throw new Error('fal ' + r.status);
      const j = await r.json();
      return { url: j.video?.url || j.output?.url, raw: j };
    }
    if (p.type === 'luma') {
      const r = await fetch('https://api.lumalabs.ai/dream-machine/v1/generations', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ prompt, model, aspect_ratio: opts.aspect || '16:9' }),
      });
      if (!r.ok) throw new Error('Luma ' + r.status);
      const j = await r.json();
      return { id: j.id, raw: j, note: 'poll /generations/:id for URL' };
    }
    if (p.type === 'runway') {
      const r = await fetch('https://api.dev.runwayml.com/v1/image_to_video', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key, 'X-Runway-Version': '2024-11-06' },
        body: JSON.stringify({ model, promptText: prompt, duration: opts.duration || 5, ratio: opts.aspect || '1280:768' }),
      });
      if (!r.ok) throw new Error('Runway ' + r.status);
      const j = await r.json();
      return { id: j.id, raw: j, note: 'poll for URL' };
    }
    if (p.type === 'pika') {
      const r = await fetch('https://api.pika.art/generate/2.0', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ prompt }),
      });
      if (!r.ok) throw new Error('Pika ' + r.status);
      const j = await r.json();
      return { id: j.id, raw: j, note: 'poll for URL' };
    }
    if (p.type === 'kling') {
      const r = await fetch('https://api.klingai.com/v1/videos/text2video', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model, prompt }),
      });
      if (!r.ok) throw new Error('Kling ' + r.status);
      const j = await r.json();
      return { id: j.data.task_id, raw: j, note: 'poll for URL' };
    }
    throw new Error('unknown video provider type: ' + p.type);
  }

  // ═══════════════════════ TTS · aiTTS ═══════════════════════════════
  async function aiTTS(text, opts) {
    opts = opts || {};
    const providerKey = opts.provider || STATE.config.tts_provider || 'elevenlabs';
    const p = TTS_PROVIDERS[providerKey];
    const key = getKey('tts', providerKey);
    if (!key) return null;
    const model = opts.model || getModel('tts', providerKey, TTS_PROVIDERS);

    if (p.type === 'elevenlabs') {
      const voice = opts.voice || '21m00Tcm4TlvDq8ikWAM';
      const r = await fetch('https://api.elevenlabs.io/v1/text-to-speech/' + voice, {
        method: 'POST', headers: { 'xi-api-key': key, 'content-type': 'application/json' },
        body: JSON.stringify({ text, model_id: model }),
      });
      if (!r.ok) throw new Error('ElevenLabs ' + r.status);
      const blob = await r.blob();
      return { url: URL.createObjectURL(blob), blob };
    }
    if (p.type === 'openai_tts') {
      const r = await fetch('https://api.openai.com/v1/audio/speech', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model, input: text, voice: opts.voice || 'alloy' }),
      });
      if (!r.ok) throw new Error('OpenAI TTS ' + r.status);
      const blob = await r.blob();
      return { url: URL.createObjectURL(blob), blob };
    }
    if (p.type === 'cartesia') {
      const r = await fetch('https://api.cartesia.ai/tts/bytes', {
        method: 'POST', headers: { 'content-type': 'application/json', 'X-API-Key': key, 'Cartesia-Version': '2024-11-13' },
        body: JSON.stringify({ model_id: model, transcript: text, voice: { mode: 'id', id: opts.voice || 'a0e99841-438c-4a64-b679-ae501e7d6091' }, output_format: { container: 'mp3', encoding: 'mp3', sample_rate: 44100 } }),
      });
      if (!r.ok) throw new Error('Cartesia ' + r.status);
      const blob = await r.blob();
      return { url: URL.createObjectURL(blob), blob };
    }
    if (p.type === 'playht') {
      const r = await fetch('https://api.play.ht/api/v2/tts/stream', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key, 'X-USER-ID': opts.userId || '' },
        body: JSON.stringify({ text, voice: opts.voice || 's3://voice-cloning-zero-shot/d9ff78ba-d016-47f6-b0ef-dd630f59414e/female-cs/manifest.json', voice_engine: model }),
      });
      if (!r.ok) throw new Error('PlayHT ' + r.status);
      const blob = await r.blob();
      return { url: URL.createObjectURL(blob), blob };
    }
    throw new Error('unknown TTS provider type: ' + p.type);
  }

  // ═══════════════════════ STT · aiSTT ═══════════════════════════════
  async function aiSTT(blob, opts) {
    opts = opts || {};
    const providerKey = opts.provider || STATE.config.stt_provider || 'deepgram';
    const p = STT_PROVIDERS[providerKey];
    const key = getKey('stt', providerKey);
    if (!key) return null;
    const model = opts.model || getModel('stt', providerKey, STT_PROVIDERS);

    if (p.type === 'deepgram') {
      const r = await fetch('https://api.deepgram.com/v1/listen?model=' + model + '&smart_format=true', {
        method: 'POST', headers: { 'Authorization': 'Token ' + key, 'content-type': blob.type || 'audio/wav' },
        body: blob,
      });
      if (!r.ok) throw new Error('Deepgram ' + r.status);
      const j = await r.json();
      return { text: j.results?.channels?.[0]?.alternatives?.[0]?.transcript, raw: j };
    }
    if (p.type === 'assemblyai') {
      const up = await fetch('https://api.assemblyai.com/v2/upload', { method: 'POST', headers: { 'Authorization': key }, body: blob });
      const upJ = await up.json();
      const r = await fetch('https://api.assemblyai.com/v2/transcript', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': key },
        body: JSON.stringify({ audio_url: upJ.upload_url, speech_model: model }),
      });
      if (!r.ok) throw new Error('AssemblyAI ' + r.status);
      const j = await r.json();
      return { id: j.id, raw: j, note: 'poll for text' };
    }
    if (p.type === 'openai_stt') {
      const fd = new FormData();
      fd.append('file', blob, 'audio.wav');
      fd.append('model', model);
      const r = await fetch('https://api.openai.com/v1/audio/transcriptions', {
        method: 'POST', headers: { 'Authorization': 'Bearer ' + key }, body: fd,
      });
      if (!r.ok) throw new Error('OpenAI Whisper ' + r.status);
      const j = await r.json();
      return { text: j.text, raw: j };
    }
    throw new Error('unknown STT provider type: ' + p.type);
  }

  // ─── WebRTC P2P mesh ────────────────────────────────────────────────
  const MESH_CHANNEL = 'fall-signal';
  const MESH_MODULE = '/fall-kit/core/mesh.mjs', MESH_DEVICE = '/fall-kit/core/mesh-device.mjs';
  // v3.2: the LIGHT mesh, loaded from this origin when the mesh is switched on. null = JSON, as before v3.2.
  async function lightMesh() {
    try {
      const [M, D] = await Promise.all([import(MESH_MODULE), import(MESH_DEVICE)]);
      const dev = await D.openDevice();
      const tab = crypto.getRandomValues(new Uint32Array(1))[0];
      return { M, dev, tab, seq: 0, last: new Map() };
    } catch (e) { return null; }
  }
  function meshSend(value) {
    const L = STATE.mesh.light, bc = STATE.mesh.bc;
    if (!L) { bc.postMessage(value); STATE.mesh.stats.sent++; return; }
    L.seq += 1;
    L.M.speak(value, { slot: L.dev.slot, tab: L.tab, seq: L.seq, sign: L.dev.sign }).then((r) => { if (r.ok && STATE.mesh.bc) { STATE.mesh.bc.postMessage(r.bytes); STATE.mesh.stats.sent++; } });
  }
  async function meshStart(opts) {
    if (STATE.mesh.active) return;
    opts = opts || {};
    const seedId = opts.seedId || (location.pathname + '#' + Math.random().toString(36).slice(2, 8));
    STATE.mesh.seedId = seedId;
    try { STATE.mesh.bc = new BroadcastChannel(MESH_CHANNEL); }
    catch (e) { console.warn('fall-kit: BroadcastChannel unavailable'); return; }
    STATE.mesh.active = true;
    STATE.mesh.light = opts.light === false ? null : await lightMesh();
    const st = STATE.mesh.stats;
    STATE.mesh.bc.onmessage = async (e) => {
      const L = STATE.mesh.light;
      if (!L) {
        const m = e.data;
        if (!m || !m.kind || m.peerId === seedId) return;
        if (opts.onMessage) opts.onMessage(m);
        return;
      }
      const r = await L.M.hearMesh(e.data, { slot: L.dev.slot, id: L.dev.id, raw: L.dev.raw, verifyBytes: L.dev.verifyBytes, last: L.last });
      if (!r.ok) { st.refused[r.stage] = (st.refused[r.stage] || 0) + 1; return; }
      if (r.legacy) st.legacy++; else st.admitted++;
      if (r.value.peerId === seedId) return;
      if (opts.onMessage) opts.onMessage(Object.assign({}, r.value, r.legacy ? { legacy: true } : { light: true, tab: r.tab }));
    };
    meshSend({ kind: 'fall-kit:hello', peerId: seedId, ts: Date.now(), seedName: opts.seedName || 'unknown' });
    notify('Mesh active · channel ' + MESH_CHANNEL + (STATE.mesh.light ? ' · LIGHT' : ''), 'ok');
  }
  function meshPost(kind, payload) {
    if (!STATE.mesh.active || !STATE.mesh.bc) return false;
    meshSend({ kind: kind, peerId: STATE.mesh.seedId, ts: Date.now(), payload: payload });
    return true;
  }
  function meshStats() {
    const s = STATE.mesh.stats;
    return { active: STATE.mesh.active, light: !!STATE.mesh.light, tab: STATE.mesh.light ? STATE.mesh.light.tab : null, sent: s.sent, admitted: s.admitted, legacy: s.legacy, refused: Object.assign({}, s.refused) };
  }

  // ─── Toast ──────────────────────────────────────────────────────────
  function notify(msg, kind) {
    let t = $('#fk-toast');
    if (!t) {
      t = document.createElement('div'); t.id = 'fk-toast';
      t.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:#c08a3a;color:#0a0a0a;padding:9px 18px;border-radius:3px;font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:0;transition:all .22s;z-index:10000;pointer-events:none';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.background = kind === 'err' ? '#a14a2a' : kind === 'ok' ? '#6b8d4a' : '#c08a3a';
    t.style.color = kind === 'err' ? '#fff' : '#0a0a0a';
    t.style.opacity = '1';
    t.style.transform = 'translateX(-50%) translateY(0)';
    clearTimeout(t._to);
    t._to = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(20px)'; }, 2400);
  }

          <tr><td style="padding:6px 10px;border-top:1px solid #2a2934;color:#c08a3a;font-weight:600">T3</td><td style="padding:6px 10px;border-top:1px solid #2a2934;color:#a89e88">BYOK · 12 text providers (Claude, GPT, Gemini, Groq, Cerebras, DeepSeek, OpenRouter, Mistral, Cohere, Together, HuggingFace, Grok) · 7 image (fal, HF, Replicate, DALL-E, Imagen, Ideogram, Leonardo, Aurora) · 5 video (fal, Luma, Runway, Pika, Kling) · 4 TTS (ElevenLabs, OpenAI, PlayHT, Cartesia) · 3 STT (Deepgram, AssemblyAI, Whisper). You bring keys, you pay direct. Keys are held in this tab only, unless you choose to remember them on this device. The same opening is sent first every time, so a provider that caches can reuse its reading of it.</td></tr>
        </tbody>
      </table>
      <p style="font-size:12px;color:#6e6a5e;line-height:1.6;margin-top:10px">Open the AI chip in the header to switch tier or check status. Cross-seed mesh activates a BroadcastChannel on <code style="background:#1a1922;padding:1px 5px;border-radius:2px">${MESH_CHANNEL}</code> so other estate seeds on the same device discover this one.</p>
    </div>`;
  }

  // ─── CSS for AI chip ────────────────────────────────────────────────
  function injectCss() {
    if (STATE.cssIn) return;   // the kit knows it added its styles; no lookup of an id the build's own page never has
    STATE.cssIn = true;
    const s = document.createElement('style');
    s.id = 'fk-css';
    s.textContent = `
      #fk-ai-chip { display:inline-flex; align-items:center; gap:6px; padding:4px 9px; border-radius:3px; font-family:ui-monospace,Menlo,monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; font-weight:600; cursor:pointer; border:1px solid #3a342c; background:#1a1922; color:#a89e88; user-select:none; vertical-align:middle }
      #fk-ai-chip:hover { border-color:#c08a3a; color:#ebe3d2 }
      #fk-ai-chip.fk-chip-live { border-color:#6b8d4a; color:#6b8d4a; background:rgba(107,141,74,.10) }
      #fk-ai-chip.fk-chip-loading { border-color:#e8a83a; color:#e8a83a; background:rgba(232,168,58,.10) }
      #fk-ai-chip.fk-chip-warn { border-color:#a14a2a; color:#a14a2a; background:rgba(161,74,42,.08) }
      #fk-ai-chip .fk-dot { width:6px; height:6px; border-radius:50%; background:currentColor; flex-shrink:0 }
      #fk-ai-chip.fk-chip-loading .fk-dot { animation:fk-pulse 1s infinite }
      @keyframes fk-pulse { 0%,100%{opacity:1}50%{opacity:.3} }
      .fk-ai-assist { display:inline-flex; align-items:center; gap:5px; padding:4px 9px; font-size:11px; border:1px solid #c08a3a; color:#c08a3a; background:transparent; border-radius:3px; cursor:pointer; font-family:inherit }
      .fk-ai-assist:hover { background:#c08a3a; color:#0a0a0a }
      .fk-ai-assist::before { content:'✦'; font-size:12px }
    `;
    document.head.appendChild(s);
  }

  // ─── The floating chip keeps clear of the build's own fixed bars and controls ─────────
  // A build's bottom tab bar or floating button stays put while the page scrolls, so a chip over it would hide it. The
  // chip looks at what is under it and moves up past it; a fixed container as tall as the page counts only by the
  // control under the chip. Content that scrolls is not in the way.
  function blockerUnder(el) {
    let fixed = null;
    for (let e = el; e && e !== document.body && e !== document.documentElement; e = e.parentElement) {
      const pos = getComputedStyle(e).position;
      if (pos === 'fixed' || pos === 'sticky') { fixed = e; break; }
    }
    if (!fixed) return null;
    if (fixed.getBoundingClientRect().height <= innerHeight * 0.4) return fixed;
    return el.closest('button, a, input, select, textarea, label, [role=button], [tabindex]');
  }
  function placeChip(chip) {
    if (!chip || chip.dataset.anchored) return;
    chip.style.top = ''; chip.style.bottom = '14px';
    for (let i = 0; i < 6; i++) {
      const r = chip.getBoundingClientRect();
      chip.style.visibility = 'hidden';
      const hit = [[r.left + 2, r.top + 2], [r.right - 2, r.top + 2], [r.left + 2, r.bottom - 2], [r.right - 2, r.bottom - 2]]
        .map(([x, y]) => document.elementFromPoint(x, y)).filter(Boolean).map(blockerUnder).find(Boolean);
      chip.style.visibility = '';
      if (!hit) return;
      const bottom = innerHeight - hit.getBoundingClientRect().top + 8;
      if (bottom > innerHeight * 0.6) { chip.style.bottom = ''; chip.style.top = '14px'; return; }
      chip.style.bottom = bottom + 'px';
    }
  }

  // ─── Init ───────────────────────────────────────────────────────────
  function init(opts) {
    opts = opts || {};
    injectCss();
    if (opts.seedName) STATE.config.seedName = opts.seedName;
    if ($('#fk-ai-chip')) { renderAiChip(); return { version: FALL_KIT_VERSION, mounted: false }; }
    const chip = document.createElement('button');
    chip.id = 'fk-ai-chip';
    chip.title = 'AI helper · ask about this page, or pick the brain';
    chip.innerHTML = '<span class="fk-dot"></span><span id="fk-ai-chip-text">T0 · off</span>';
    chip.onclick = () => openSettings();
    const anchor = opts.chipAnchor ? $(opts.chipAnchor) : null;
    if (anchor) { anchor.appendChild(chip); chip.dataset.anchored = '1'; }
    else {
      chip.style.cssText += ';position:fixed;bottom:14px;left:14px;z-index:9998;box-shadow:0 4px 14px rgba(0,0,0,.4)';
      document.body.appendChild(chip);
      const place = () => placeChip(chip);
      setTimeout(place, 0); setTimeout(place, 1200);   // once now, once after the build has laid itself out
      let t = null; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(place, 200); });
    }
    renderAiChip();
    if (BOOT.moved) notify('AI keys are now held in this tab only · tick “remember” in AI settings to keep them', 'info');
    return { version: FALL_KIT_VERSION, mounted: true };
  }

  // ─── Public API ─────────────────────────────────────────────────────
  root.FallKit = {
    version: FALL_KIT_VERSION,
    init: init,
    aiTier: aiTier,
    aiComplete: aiComplete,
    aiChat: aiChat,
    askPage: askPage,
    pageOpening: pageOpening,
    lastUsage: () => STATE.lastUsage,
    forgetKeys: forgetKeys,
    requestOf: requestOf,
    textOf: textOf,
    usageOf: usageOf,
    configFrom: configFrom,
    storedForm: storedForm,
    aiImage: aiImage,
    aiVideo: aiVideo,
    aiTTS: aiTTS,
    aiSTT: aiSTT,
    loadWebLLM: loadWebLLM,
    openSettings: openSettings,
    closeSettings: closeSettings,
    renderAiChip: renderAiChip,
    helpSection: helpSection,
    meshStart: meshStart,
    meshPost: meshPost,
    meshStats: meshStats,
    notify: notify,
    MODELS: WEBLLM_MODELS,
    TEXT_PROVIDERS: TEXT_PROVIDERS,
    IMAGE_PROVIDERS: IMAGE_PROVIDERS,
    VIDEO_PROVIDERS: VIDEO_PROVIDERS,
    TTS_PROVIDERS: TTS_PROVIDERS,
    STT_PROVIDERS: STT_PROVIDERS,
    state: STATE,
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

  // fall-kit init · auto-mounts a floating AI chip bottom-left

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go);
    else go();
  })();
</script>

</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="mark">◊</div><div><div class="name">FallHR</div></div><div class="seal">v1 · prime 1009</div></div>
  <nav class="tabs" id="tabNav"></nav>
  <div class="tools-r"><button class="tool-btn" id="tierBadge" onclick="openModal('settings')">T0</button><button class="tool-btn" onclick="openModal('settings')">⚙</button></div>
</header>
<main id="view"></main>
</div>
<div class="modal-bg" id="modal"><div class="modal"><h2 id="modalTitle">.</h2><div id="modalBody"></div></div></div>
<div class="toast" id="toast">.</div>

<script>
'use strict';
const TOOLNAME='fallhr',VERSION='1.0.0',PRIME=1009,STORE='fallhr-v1';
const TABS=[{id:'dashboard',label:'dashboard'},{id:'employees',label:'employees'},{id:'holiday',label:'holiday'},{id:'absence',label:'absence'},{id:'reviews',label:'reviews'},{id:'contracts',label:'contracts'},{id:'compliance',label:'compliance'},{id:'qa',label:'Q&A'}];

const RULES={
  statutoryHolidayDays:28, // 5.6 weeks for full-time
  smpFlatWeekly:184.03,
  sspWeekly:118.75,
  sspWaitingDays:3,
  sspMaxWeeks:28,
  autoEnrolMinAge:22,
  autoEnrolMinEarnings:10000,
  autoEnrolEmployer:0.03,
  autoEnrolEmployee:0.05,
  niSecondaryThreshold:9100,
  niEmployerRate:0.138,
  rightToWorkRetentionYears:2,
  noticeStatutoryMinWeeksOver1Yr:1, // +1 per year of service to max 12
  redundancyQualifyingYears:2,
};

let state={active:'dashboard',firm:null,employees:[],holiday:[],absence:[],reviews:[],contracts:[],complianceChecks:[],audit:[],
  ui:{chat:[]},settings:{anthropicKey:'',auditChain:true}};

const $=(s,p=document)=>p.querySelector(s);const uid=p=>(p||'')+'_'+Math.random().toString(36).slice(2,11);const now=()=>Date.now();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{const v=Number(n);return isNaN(v)?'—':'£'+v.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})};
const dateStr=ts=>{if(!ts)return '—';return new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})};
const yearsBetween=(d1,d2)=>{if(!d1)return 0;const ms=(d2||now())-new Date(d1).getTime();return Math.floor(ms/(365.25*24*60*60*1000))};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._to);t._to=setTimeout(()=>t.classList.remove('show'),1900)}
async function sha256(s){const buf=new TextEncoder().encode(s);const h=await crypto.subtle.digest('SHA-256',buf);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('')}

let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(STORE,1);r.onupgradeneeded=e=>{const d=e.target.result;['state','audit','firms','employees','holiday','absence','reviews','contracts'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:s==='state'?undefined:'id'})})};r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=rej})}
function idbGetAll(s){return new Promise(res=>{const tx=db.transaction(s,'readonly');const q=tx.objectStore(s).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])})}
function idbGet(s,k){return new Promise(res=>{const tx=db.transaction(s,'readonly');const q=tx.objectStore(s).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}
function idbPut(s,v,k){return new Promise(res=>{const tx=db.transaction(s,'readwrite');const o=tx.objectStore(s);const q=k!=null?o.put(v,k):o.put(v);q.onsuccess=()=>res(true);q.onerror=()=>res(false)})}
async function loadAll(){if(!db)await openDB();const[firms,emps,hol,abs,rev,con,auditArr,uiState]=await Promise.all([idbGetAll('firms'),idbGetAll('employees'),idbGetAll('holiday'),idbGetAll('absence'),idbGetAll('reviews'),idbGetAll('contracts'),idbGetAll('audit'),idbGet('state','ui')]);state.firm=firms[0]||null;state.employees=emps;state.holiday=hol;state.absence=abs;state.reviews=rev;state.contracts=con;state.audit=auditArr.sort((a,b)=>a.i-b.i);if(uiState){state.ui=Object.assign({},state.ui,uiState.value||{});state.settings=Object.assign({},state.settings,uiState.settings||{});if(uiState.value?.complianceChecks)state.complianceChecks=uiState.value.complianceChecks}}
async function persistUI(){await idbPut('state',{value:{...state.ui,complianceChecks:state.complianceChecks},settings:state.settings},'ui')}
// ⚑ The writer now shares ONE layout with verifyAudit(), so they cannot drift apart.
async function auditLog(action,opts={}){
  if(!state.settings.auditChain)return;
  const prev=state.audit.length?state.audit[state.audit.length-1]:null;
  const sealed=await AUDITCHAIN.append(state.audit,{id:uid('au'),i:(prev?prev.i:0)+1,ts:now(),tool:TOOLNAME,action,reasoning:opts.reasoning||'',configVersion:TOOLNAME+'@'+VERSION,payload:opts.payload||{}});
  state.audit.push(sealed);await idbPut('audit',sealed);
}
// The check that never existed anywhere in this tool.
async function verifyAudit(expectHead){return AUDITCHAIN.verify(state.audit,expectHead?{expectHead}:null)}

let bcHr,bcSignal;
function initMesh(){try{bcSignal=new BroadcastChannel('fall-signal');bcSignal.postMessage({source:TOOLNAME,type:'hello',prime:PRIME,version:VERSION,ts:now()})}catch(e){}try{bcHr=new BroadcastChannel('fall-hr');bcHr.addEventListener('message',async e=>{const m=e.data;if(!m||m.source===TOOLNAME)return;if(m.type==='sync.request'){bcHr.postMessage({v:1,type:'sync.snapshot',ts:now(),source:TOOLNAME,payload:{employees:state.employees,firm:state.firm}})}else if(m.type==='sync.snapshot'){const p=m.payload||{};if(Array.isArray(p.employees))for(const x of p.employees){if(!state.employees.find(y=>y.id===x.id)){state.employees.push(x);await idbPut('employees',x)}}render()}});bcHr.postMessage({v:1,type:'sync.request',ts:now(),source:TOOLNAME})}catch(e){}}

function activeEmps(){return state.employees.filter(e=>e.status==='active')}
function holidayUsed(empId,yr){const y=yr||new Date().getFullYear();return state.holiday.filter(h=>h.employeeId===empId&&h.status==='approved'&&new Date(h.startDate).getFullYear()===y).reduce((s,h)=>s+Number(h.days||0),0)}
function holidayPending(){return state.holiday.filter(h=>h.status==='requested').length}
function absenceDaysYTD(empId){const yearStart=new Date(new Date().getFullYear(),0,1);return state.absence.filter(a=>a.employeeId===empId&&new Date(a.startDate)>=yearStart).reduce((s,a)=>s+Number(a.days||0),0)}
function bradfordFactor(empId){const yearStart=new Date(new Date().getFullYear(),0,1);const inst=state.absence.filter(a=>a.employeeId===empId&&new Date(a.startDate)>=yearStart);const n=inst.length;const d=inst.reduce((s,a)=>s+Number(a.days||0),0);return n*n*d}
function reviewDue(emp){if(!emp.lastReviewDate)return true;const months=(now()-new Date(emp.lastReviewDate).getTime())/(30.44*24*60*60*1000);return months>=12}

function render(){$('#tabNav').innerHTML=TABS.map(t=>`<button class="${state.active===t.id?'active':''}" onclick="switchTab('${t.id}')">${t.label}</button>`).join('');const v=$('#view');switch(state.active){case 'dashboard':return renderDashboard(v);case 'employees':return renderEmployees(v);case 'holiday':return renderHoliday(v);case 'absence':return renderAbsence(v);case 'reviews':return renderReviews(v);case 'contracts':return renderContracts(v);case 'compliance':return renderCompliance(v);case 'qa':return renderQA(v)}}
function switchTab(id){state.active=id;persistUI();render()}

function renderDashboard(v){const reviewsDue=activeEmps().filter(reviewDue).length;
  v.innerHTML=`<div class="disclaimer"><strong>◊ Regulatory notice:</strong> FallHR is shaped by Employment Rights Act 1996, Working Time Regulations 1998, Equality Act 2010, ACAS Code of Practice, and HMRC PAYE/RTI rules. All employment decisions remain the employer's responsibility. Data never leaves this device.</div><div class="section-h"><h2>Dashboard</h2><div class="sub">${state.firm?.name||'set up firm'}</div></div><div class="kpi-grid"><div class="kpi"><div class="label">Active employees</div><div class="val">${activeEmps().length}</div><div class="hint">total ${state.employees.length}</div></div><div class="kpi"><div class="label">Holiday requests</div><div class="val" style="color:${holidayPending()>0?'var(--amber)':'var(--green)'};">${holidayPending()}</div><div class="hint">pending</div></div><div class="kpi"><div class="label">Open absence</div><div class="val">${state.absence.filter(a=>!a.endDate).length}</div></div><div class="kpi"><div class="label">Reviews due</div><div class="val" style="color:${reviewsDue>0?'var(--amber)':'var(--green)'};">${reviewsDue}</div><div class="hint">annual cycle</div></div><div class="kpi"><div class="label">Contracts</div><div class="val">${state.contracts.length}</div></div><div class="kpi"><div class="label">Audit entries</div><div class="val">${state.audit.length}</div></div></div>`}

function renderEmployees(v){v.innerHTML=`<div class="section-h"><h2>Employees</h2><div class="sub">${state.employees.length}</div><div class="actions"><button class="btn brass sm" onclick="openModal('addEmp')">+ Employee</button></div></div>${state.employees.length?`<table><thead><tr><th>Name</th><th>Job title</th><th>Start date</th><th>Service</th><th>Status</th><th>RTW</th><th>Holiday used YTD</th></tr></thead><tbody>${state.employees.sort((a,b)=>(b.startDate||'').localeCompare(a.startDate||'')).map(e=>{const yrs=yearsBetween(e.startDate);const hUsed=holidayUsed(e.id);return `<tr><td><strong>${esc(e.firstName)} ${esc(e.lastName)}</strong><div style="font-size:11px;color:var(--cream-muted)">${esc(e.email)}</div></td><td>${esc(e.jobTitle)}</td><td>${esc(e.startDate)}</td><td>${yrs}y ${e.startDate?Math.floor(((now()-new Date(e.startDate))/(30.44*24*60*60*1000))%12):0}m</td><td><span class="pill ${e.status==='active'?'green':e.status==='probation'?'amber':e.status==='leaver'?'red':'blue'}">${e.status}</span></td><td><span class="pill ${e.rtw?.verified?'green':'red'}">${e.rtw?.verified?'✓':'✗'}</span></td><td class="num">${hUsed}/${e.holidayEntitlement||28}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No employees yet.</div>'}`}

function renderHoliday(v){v.innerHTML=`<div class="section-h"><h2>Holiday</h2><div class="sub">${holidayPending()} pending</div><div class="actions"><button class="btn brass sm" onclick="openModal('addHoliday')">+ Request</button></div></div>${state.holiday.length?`<table><thead><tr><th>Employee</th><th>Start</th><th>End</th><th class="num">Days</th><th>Type</th><th>Status</th><th>Action</th></tr></thead><tbody>${state.holiday.sort((a,b)=>(b.startDate||'').localeCompare(a.startDate||'')).map(h=>{const emp=state.employees.find(e=>e.id===h.employeeId);return `<tr><td>${esc(emp?(emp.firstName+' '+emp.lastName):h.employeeId.slice(0,8))}</td><td>${esc(h.startDate)}</td><td>${esc(h.endDate)}</td><td class="num">${h.days}</td><td><span class="pill ${h.type==='annual'?'blue':h.type==='sick'?'red':'amber'}">${h.type}</span></td><td><span class="pill ${h.status==='approved'?'green':h.status==='rejected'?'red':'amber'}">${h.status}</span></td><td>${h.status==='requested'?`<button class="btn sm" style="border-color:var(--green);color:var(--green)" onclick="approveHoliday('${h.id}')">✓</button> <button class="btn sm danger" onclick="rejectHoliday('${h.id}')">✗</button>`:'—'}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No holiday requests.</div>'}`}
async function approveHoliday(id){const h=state.holiday.find(x=>x.id===id);if(!h)return;h.status='approved';h.decisionAt=now();await idbPut('holiday',h);await auditLog('holiday.approved',{payload:{id}});toast('Approved');render()}
async function rejectHoliday(id){const h=state.holiday.find(x=>x.id===id);if(!h)return;h.status='rejected';h.decisionAt=now();await idbPut('holiday',h);await auditLog('holiday.rejected',{payload:{id}});toast('Rejected');render()}

function renderAbsence(v){v.innerHTML=`<div class="section-h"><h2>Absence</h2><div class="sub">SSP ${fmt(RULES.sspWeekly)}/wk · ${RULES.sspWaitingDays} waiting days</div><div class="actions"><button class="btn brass sm" onclick="openModal('addAbsence')">+ Absence</button></div></div>${state.absence.length?`<table><thead><tr><th>Employee</th><th>Start</th><th>End</th><th class="num">Days</th><th>Reason</th><th class="num">Bradford factor</th><th>Self-cert/Fit note</th></tr></thead><tbody>${state.absence.sort((a,b)=>(b.startDate||'').localeCompare(a.startDate||'')).map(a=>{const emp=state.employees.find(e=>e.id===a.employeeId);const bf=emp?bradfordFactor(emp.id):0;return `<tr><td>${esc(emp?(emp.firstName+' '+emp.lastName):a.employeeId.slice(0,8))}</td><td>${esc(a.startDate)}</td><td>${esc(a.endDate||'ongoing')}</td><td class="num">${a.days}</td><td>${esc(a.reason)}</td><td class="num" style="color:${bf>200?'var(--red)':bf>100?'var(--amber)':'var(--cream-dim)'};">${bf}</td><td>${esc(a.evidence||'—')}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No absence recorded.</div>'}<div class="card" style="margin-top:18px"><h3>Bradford Factor (informational)</h3><p style="font-size:12px;color:var(--cream-dim);line-height:1.55">B = S² × D, where S = number of absence instances and D = total days absent in the period. Threshold guidance varies by employer policy. Common: 50 = trigger informal chat, 100 = formal review, 200+ = formal action under capability or disciplinary policy.</p></div>`}

function renderReviews(v){v.innerHTML=`<div class="section-h"><h2>Performance Reviews</h2><div class="sub">${activeEmps().filter(reviewDue).length} due</div><div class="actions"><button class="btn brass sm" onclick="openModal('addReview')">+ Review</button></div></div>${state.reviews.length?`<table><thead><tr><th>Employee</th><th>Date</th><th>Cycle</th><th>Rating</th><th>Outcome</th><th>Next review</th></tr></thead><tbody>${state.reviews.sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(r=>{const emp=state.employees.find(e=>e.id===r.employeeId);return `<tr><td>${esc(emp?(emp.firstName+' '+emp.lastName):r.employeeId.slice(0,8))}</td><td>${esc(r.date)}</td><td>${esc(r.cycle)}</td><td><span class="pill ${r.rating==='exceeding'?'green':r.rating==='meeting'?'blue':r.rating==='developing'?'amber':'red'}">${r.rating}</span></td><td>${esc(r.outcome||'—')}</td><td>${esc(r.nextDate||'—')}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No reviews recorded.</div>'}`}

function renderContracts(v){v.innerHTML=`<div class="section-h"><h2>Contracts</h2><div class="sub">${state.contracts.length}</div><div class="actions"><button class="btn brass sm" onclick="openModal('addContract')">+ Contract</button></div></div>${state.contracts.length?`<table><thead><tr><th>Employee</th><th>Type</th><th>Issue date</th><th>Signed</th><th>S.1 Statement</th></tr></thead><tbody>${state.contracts.map(c=>{const emp=state.employees.find(e=>e.id===c.employeeId);return `<tr><td>${esc(emp?(emp.firstName+' '+emp.lastName):c.employeeId.slice(0,8))}</td><td>${esc(c.contractType)}</td><td>${esc(c.issueDate)}</td><td><span class="pill ${c.signed?'green':'amber'}">${c.signed?'yes':'pending'}</span></td><td><span class="pill ${c.s1Statement?'green':'red'}">${c.s1Statement?'issued':'missing'}</span></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No contracts.</div>'}<div class="card" style="margin-top:18px"><h3>S.1 Employment Rights Act 1996 — written statement of particulars</h3><p style="font-size:12px;color:var(--cream-dim);line-height:1.55">Since 6 April 2020, employers must issue a written statement of employment particulars to all workers (not just employees) on or before day one of work. Failure can lead to Employment Tribunal award of 2-4 weeks pay. Generate via FallHRPaper.</p></div>`}

  {id:'workingTimeOptOut',name:'Working Time opt-outs documented (if >48hrs)',cat:'Working Time',desc:'WTR 1998 reg 4(1). 48-hr weekly maximum unless opted-out in writing. Records retained 2 years.'},

  {id:'elInsurance',name:'Employers Liability insurance (£5M min)',cat:'Insurance',desc:'Employers Liability (Compulsory Insurance) Act 1969. Certificate displayed. Penalty up to £2,500/day uninsured.'},
  {id:'paye',name:'PAYE/RTI registered with HMRC',cat:'Payroll',desc:'Real Time Information. FPS by/on payday. EPS by 19th. P60 by 31 May. P11D by 6 Jul.'},

async function toggleComp(id){if(!state.complianceChecks)state.complianceChecks=[];const idx=state.complianceChecks.indexOf(id);if(idx>=0)state.complianceChecks.splice(idx,1);else state.complianceChecks.push(id);await persistUI();await auditLog('compliance.toggle',{payload:{id}});render()}

const T0_QA=[
  {q:/s\.?1|statement of particulars|day.?one/i,a:'Employment Rights Act 1996 s.1: written statement of employment particulars must be issued to all workers (not just employees) on or before day one. Must include: names, start date, pay, hours, holiday, sick pay, notice, place of work, job description, probation, training, benefits, disciplinary/grievance procedure. Failure: tribunal award 2-4 weeks pay (Employment Act 2002 s.38). Since 6 Apr 2020 this is a day-one right (was 2 months previously).'},
  {q:/rtw|right.?to.?work|immigration/i,a:'Immigration, Asylum and Nationality Act 2006: verify Right to Work BEFORE engagement starts. Documents: UK/Irish passport, gov.uk share code (non-UK nationals), BRP, valid visa. Online checks via gov.uk for non-UK. Keep copies for duration + 2 years. Civil penalty up to £45,000 per illegal worker (Feb 2024). Repeat: criminal prosecution.'},
  {q:/pension|auto.?enrol|nest/i,a:'Pensions Act 2008: auto-enrolment for eligible jobholders (age 22 to SPA, earning £10,000+ in pay reference period). Minimum contributions: employer 3%, employee 5%, total 8% (since 6 Apr 2019). Earnings band £6,240-£50,270 (2024/25). Re-enrolment every 3 years. The Pensions Regulator (TPR) enforces; fixed penalty £400 then escalating daily penalties.'},
  {q:/wtr|working.?time|48|holiday/i,a:'Working Time Regulations 1998: 48-hour maximum weekly working time (averaged 17 weeks) unless opted out in writing. 5.6 weeks paid annual leave (28 days FT incl bank holidays — employer may include or exclude). Rest breaks: 20 min if working over 6 hrs. Daily rest: 11 consecutive hrs. Weekly rest: 24 hrs (or 48 hrs/14 days). Night work limits: 8 hrs avg in 24.'},
  {q:/ssp|sick.?pay|fit.?note|self.?cert/i,a:'Statutory Sick Pay (SSP): £118.75/week from 6 Apr 2025. Qualifying days, 3 waiting days, max 28 weeks. Self-certification for first 7 days, fit note required from day 8 (GP, AHP, or hospital doctor). Employer recovery via PAYE Percentage Threshold Scheme abolished from Apr 2014. Records retained 3 years.'},
  {q:/maternity|smp|paternity|adoption/i,a:'Statutory Maternity Pay (SMP): 90% earnings for 6 weeks, then £184.03/week or 90% (whichever lower) for 33 weeks. Total 39 weeks paid, 52 weeks total leave. Notification 15 weeks before EWC. Form SMP1 if not qualifying. Statutory Paternity Pay 1-2 weeks at £184.03 or 90%. Shared Parental Pay up to 37 weeks shared. KIT days: 10 (SPLIT 20). SPP and ShPP eligibility: 26 weeks service.'},
  {q:/redund|notice|dismiss|unfair/i,a:'Redundancy: qualifying service 2 years for statutory pay. Calculation: half/full/1.5 weeks pay per year of service (under 22 / 22-40 / 41+), capped at £719/week (2025) and 20 years max. Notice: statutory min 1 week (1 mo-2yr service), then 1 week per year up to 12 weeks max. Unfair dismissal: 2 years qualifying. Reason must be fair (capability, conduct, redundancy, illegality, SOSR) AND fair procedure (ACAS Code).'},
  {q:/equality|discriminat|harass|protected/i,a:'Equality Act 2010: 9 protected characteristics (age, disability, gender reassignment, marriage/CP, pregnancy/maternity, race, religion, sex, sexual orientation). Direct/indirect discrimination, harassment, victimisation. Worker Protection (Amendment of Equality Act 2010) Act 2023: positive duty to prevent sexual harassment from 26 Oct 2024. Tribunal awards uncapped for discrimination.'},
  {q:/paye|rti|p60|p11d|fps|eps/i,a:'PAYE Real Time Information (RTI): submit Full Payment Submission (FPS) on or before each payday. Employer Payment Summary (EPS) by 19th of following month (e.g. period 6 by 19 Oct). P60 to each employee by 31 May. P11D for benefits-in-kind by 6 July. Late filing penalties: £100-£400 per scheme size band. Errors over 1% trigger HMRC review.'},
  {q:/acas|disciplin|grieve|tribunal/i,a:'ACAS Code of Practice on Disciplinary and Grievance Procedures: not legally binding but tribunal awards uplifted up to 25% for unreasonable non-compliance (downward up to 25% if employee unreasonable). Key steps: investigate, written notification, meeting (right to be accompanied), decision with right of appeal. Early conciliation mandatory before tribunal (ACAS).'},
];
function askT0(q){for(const r of T0_QA){if(r.q.test(q))return {answer:r.a,source:'T0 · UK HR rules'}}return null}
async function askT3(q){if(!state.settings.anthropicKey)return null;try{const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'x-api-key':state.settings.anthropicKey,'anthropic-version':'2023-06-01','content-type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,messages:[{role:'user',content:'You are a UK HR/employment law expert. ERA 1996, Equality Act 2010, WTR 1998, ACAS Code, HMRC PAYE. Concise.\n\n'+q}]})});if(!res.ok)return null;const j=await res.json();return {answer:j.content?.[0]?.text,source:'T3 · Anthropic'}}catch(e){return null}}
function renderQA(v){v.innerHTML=`<div class="section-h"><h2>Q & A</h2><div class="sub">T0 + T3 BYOK</div></div><div class="card" style="max-width:780px"><div class="chat" id="chatBox">${(state.ui.chat||[]).map(m=>`<div class="msg ${m.role}">${esc(m.text)}${m.source?`<div class="src">${esc(m.source)}</div>`:''}</div>`).join('')}</div><div class="chat-input"><input id="chatIn" placeholder="Ask… 'S.1 statement requirements?' · 'redundancy pay?' · 'auto-enrolment thresholds?'" onkeydown="if(event.key==='Enter')askQ()"><button class="btn brass" onclick="askQ()">Ask</button></div></div>`;const box=$('#chatBox');if(box)box.scrollTop=box.scrollHeight}
async function askQ(){const inp=$('#chatIn');if(!inp)return;const q=inp.value.trim();if(!q)return;inp.value='';if(!state.ui.chat)state.ui.chat=[];state.ui.chat.push({role:'user',text:q});render();let r=askT0(q);if(!r)r=await askT3(q);state.ui.chat.push(r?{role:'bot',text:r.answer,source:r.source}:{role:'bot',text:'No T0 match. Add BYOK key for T3.',source:'system'});persistUI();render()}

  else if(type==='addAbsence'){$('#modalTitle').textContent='Record Absence';$('#modalBody').innerHTML=`<div class="field"><label>Employee</label><select id="aEmp">${state.employees.map(e=>`<option value="${e.id}">${esc(e.firstName)} ${esc(e.lastName)}</option>`).join('')}</select></div><div class="row"><div class="field"><label>Start date</label><input type="date" id="aStart"></div><div class="field"><label>End date (blank if ongoing)</label><input type="date" id="aEnd"></div></div><div class="row"><div class="field"><label>Days</label><input type="number" step="0.5" id="aDays"></div><div class="field"><label>Reason</label><select id="aReason"><option>sickness</option><option>injury</option><option>mental health</option><option>family emergency</option><option>medical appt</option><option>other</option></select></div></div><div class="field"><label>Evidence</label><select id="aEvidence"><option value="self-cert">Self-certification (1-7 days)</option><option value="fit note">Fit note (Med3)</option><option value="hospital">Hospital admission</option><option value="none">None</option></select></div><div class="actions"><button class="btn brass" onclick="addAbsence()">Record</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`}

function closeModal(){$('#modal').classList.remove('open')}

async function addEmployee(){const e={id:uid('em'),firstName:$('#eFirst').value.trim(),lastName:$('#eLast').value.trim(),email:$('#eEmail').value.trim(),phone:$('#ePhone').value.trim(),jobTitle:$('#eTitle').value.trim(),department:$('#eDept').value.trim(),startDate:$('#eStart').value,status:$('#eStatus').value,salary:Number($('#eSal').value||0),hoursPerWeek:Number($('#eHrs').value||37.5),holidayEntitlement:Number($('#eHol').value||28),rtw:{verified:$('#eRtw').value==='1'},ts:now()};state.employees.push(e);await idbPut('employees',e);try{bcHr?.postMessage({v:1,type:'sync.snapshot',ts:now(),source:TOOLNAME,payload:{employees:[e]}})}catch(_){}await auditLog('employee.added',{payload:{id:e.id}});closeModal();toast('Added');render()}
async function addHoliday(){const h={id:uid('hl'),employeeId:$('#hEmp').value,startDate:$('#hStart').value,endDate:$('#hEnd').value,days:Number($('#hDays').value||0),type:$('#hType').value,notes:$('#hNotes').value.trim(),status:'requested',ts:now()};state.holiday.push(h);await idbPut('holiday',h);await auditLog('holiday.requested',{payload:{id:h.id}});closeModal();toast('Requested');render()}
async function addAbsence(){const a={id:uid('ab'),employeeId:$('#aEmp').value,startDate:$('#aStart').value,endDate:$('#aEnd').value,days:Number($('#aDays').value||0),reason:$('#aReason').value,evidence:$('#aEvidence').value,ts:now()};state.absence.push(a);await idbPut('absence',a);await auditLog('absence.recorded',{payload:{id:a.id}});closeModal();toast('Recorded');render()}
async function addReview(){const r={id:uid('rv'),employeeId:$('#rEmp').value,date:$('#rDate').value,cycle:$('#rCycle').value,rating:$('#rRating').value,outcome:$('#rOutcome').value.trim(),nextDate:$('#rNext').value,ts:now()};state.reviews.push(r);const emp=state.employees.find(e=>e.id===r.employeeId);if(emp){emp.lastReviewDate=r.date;await idbPut('employees',emp)}await idbPut('reviews',r);await auditLog('review.added',{payload:{id:r.id}});closeModal();toast('Saved');render()}
async function addContract(){const c={id:uid('co'),employeeId:$('#cEmp').value,contractType:$('#cType').value,issueDate:$('#cDate').value,signed:$('#cSigned').value==='1',s1Statement:$('#cS1').value==='1',ts:now()};state.contracts.push(c);await idbPut('contracts',c);await auditLog('contract.added',{payload:{id:c.id}});closeModal();toast('Added');render()}
async function saveSettings(){const f=state.firm||{id:uid('fi'),ts:now()};f.name=$('#fName').value.trim();f.companyNo=$('#fCoNo').value.trim();f.address=$('#fAddr').value.trim();f.payeRef=$('#fPaye').value.trim();f.aorRef=$('#fAor').value.trim();f.updatedAt=now();state.firm=f;await idbPut('firms',f);state.settings.anthropicKey=$('#sKey').value.trim();state.settings.auditChain=$('#sAudit').checked;$('#tierBadge').textContent=state.settings.anthropicKey?'T3':'T0';await persistUI();closeModal();toast('Saved');render()}
function exportAll(){const d={tool:TOOLNAME,v:VERSION,ts:now(),firm:state.firm,employees:state.employees,holiday:state.holiday,absence:state.absence,reviews:state.reviews,contracts:state.contracts};const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='fallhr-export.json';a.click();URL.revokeObjectURL(u);toast('Exported')}
function importAll(){const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.firm){state.firm=d.firm;await idbPut('firms',d.firm)}for(const k of['employees','holiday','absence','reviews','contracts']){if(Array.isArray(d[k]))for(const r of d[k]){state[k].push(r);await idbPut(k,r)}}persistUI();toast('Imported');render()}catch(e){toast('Failed')}};inp.click()}
async function wipeAll(){if(!confirm('Wipe ALL data?'))return;for(const s of['firms','employees','holiday','absence','reviews','contracts','audit','state']){const tx=db.transaction(s,'readwrite');tx.objectStore(s).clear();await new Promise(r=>{tx.oncomplete=r})}location.reload()}

// ════════════════════════════════════════════════════════════════
// THE GATED AUDIT CHAIN — inlined verbatim by build-page.mjs: the shared kernel from fallhardened
// plus this repo's own byte layout.
//
// ⚑ SCOPED IN A CLOSURE. The kernel exports names the app also uses; left at top level a later
// declaration would silently win and every call site would be passing the wrong arguments to a
// function that still looked right.
// Do not edit between the markers: edit audit.mjs, re-run the gate, rebuild the page.
// ════════════════════════════════════════════════════════════════
const AUDITCHAIN=(function(){
/* __AUDIT_KERNEL__ */
// audit-chain.mjs — a tamper-evident log that can actually be checked.
//
// ⚑ WHY THIS EXISTS. Nine tools in this estate write a hash-linked audit log — clinic, vet, HR,
// recruitment, claims, legal, insurance, books, practice — and not one of them ever re-walked it.
// prevHash and docHash were written on every action and never read back, so the tamper-evidence was
// a claim about the data rather than a property of it. A regulator asking "prove this was not edited"
// would have been handed a log that could not answer.
//
// ⚑ AND WHY IT IS A FACTORY. The bug underneath the bug is that a writer and a verifier can disagree
// about WHICH BYTES were signed, and then a check passes that should not — or fails when nothing is
// wrong. Here both come out of one call and close over the same `payloadOf`, so they cannot drift.
// You cannot construct a verifier for one layout and a writer for another by accident.
//
// The byte layout itself is deliberately NOT fixed: the nine tools each sign different fields, and
// forcing one shape would either break their existing logs or quietly re-define what was signed.

/** The hash a chain starts from. An empty string, so the first entry has nothing behind it. */
const GENESIS = '';

const isFn = (f) => typeof f === 'function';

/**
 * Build a chain that can write and check its own entries.
 *
 * @param opts.sha256    async (string) => hex digest. Injected so this stays pure and testable.
 * @param opts.payloadOf (prevHash, entry, index) => string — exactly the bytes that get signed.
 *                   May return a promise: one tool in this estate hashes the payload first and signs
 *                   THAT, so the layout itself needs to await a digest.
 * @param opts.hashField which field on an entry holds the chain hash. Default "docHash". One tool
 *                   keeps two hashes — a docHash over the payload and a separate `hash` for the
 *                   link — so the field cannot be assumed.
 */
function auditChain(opts) {
  // A default parameter does not fire on an explicit null, and null is what a caller reading a
  // missing config hands you. Normalise, then read.
  const o = (opts && typeof opts === 'object') ? opts : {};
  const sha256 = o.sha256;
  const payloadOf = o.payloadOf;
  const hashField = (typeof o.hashField === 'string' && o.hashField) ? o.hashField : 'docHash';
  // ⚑ NOT EVERY CHAIN STARTS AT THE EMPTY STRING. One tool in this estate opens its log with 64
  // zeros. Assuming genesis would make its very first entry fail to verify, for ever.
  const genesis = (typeof o.genesis === 'string') ? o.genesis : GENESIS;
  if (!isFn(sha256)) throw new Error('auditChain needs a sha256(string) function');
  if (!isFn(payloadOf)) throw new Error('auditChain needs a payloadOf(prevHash, entry, index) function');

  /**
   * The hash the next entry must link to.
   *
   * The last row is read defensively because a corrupt log is exactly when this gets called: a null
   * or non-object at the end used to throw here, which turned "your audit log has a bad row" into
   * "the app crashed while trying to write an audit entry".
   */
  function headOf(entries) {
    const log = Array.isArray(entries) ? entries : [];
    if (!log.length) return genesis;
    const last = log[log.length - 1];
    if (!last || typeof last !== 'object') return genesis;
    return String(last[hashField] ?? '');
  }

  /**
   * Seal an entry onto the end of the log. Returns a NEW entry carrying prevHash and docHash —
   * it does not mutate what it was given, because an audit writer that edits its input is the
   * first thing anyone should distrust.
   */
  async function append(entries, entry) {
    const log = Array.isArray(entries) ? entries : [];
    const prevHash = headOf(log);
    // ⚑ RESPECT THE CALLER'S NUMBERING. These tools number entries from 1 and SIGN that number.
    // Overwriting it with a zero-based position would renumber every new entry and quietly change
    // what gets hashed.
    const given = (entry && typeof entry === 'object') ? entry.i : undefined;
    const i = Number.isFinite(given) ? given : log.length;
    const base = { ...(entry && typeof entry === 'object' ? entry : {}), i, prevHash };
    // ⚑ THE THIRD ARGUMENT IS THE POSITION IN THE LOG, NOT THE ENTRY'S OWN NUMBER. verify() walks the
    // array and passes the array index, so append must pass the same thing or a one-based log signs
    // one value and verifies against another — every entry written would fail its own check.
    // A layout that wants the entry's number reads it off the entry, where it lives.
    const pos = log.length;
    // await, because a layout may itself need to hash something before it can say what is signed.
    const digest = await sha256(await payloadOf(prevHash, base, pos));
    return { ...base, [hashField]: digest };
  }

  /**
   * Walk the log and report the FIRST entry that does not reproduce. The earliest break is when the
   * tampering happened; everything after it is just that break's wake, so reporting later ones would
   * bury the answer.
   *
   * `expectHead` is optional and closes the one hole a chain cannot close on its own — see below.
   */
  async function verify(entries, checkOpts) {
    const log = Array.isArray(entries) ? entries : [];
    const c = (checkOpts && typeof checkOpts === 'object') ? checkOpts : {};
    let prev = genesis;

    for (let i = 0; i < log.length; i++) {
      const e = (log[i] && typeof log[i] === 'object') ? log[i] : {};
      if (String(e.prevHash ?? '') !== prev) {
        return { ok: false, brokeAt: i, id: e.id ?? null, entries: log.length,
                 reason: 'this entry does not link to the one before it — something was inserted, removed or reordered' };
      }
      const expected = await sha256(await payloadOf(prev, e, i));
      if (expected !== e[hashField]) {
        return { ok: false, brokeAt: i, id: e.id ?? null, entries: log.length,
                 reason: 'this entry was altered after it was written' };
      }
      prev = e[hashField];
    }

    // ⚑ THE HONEST BOUND. A chain proves nothing was changed or removed from the MIDDLE. Delete the
    // last few entries and what remains is a perfectly valid chain — the log simply looks shorter.
    // The only defence is knowing what the head should be, from somewhere the editor could not reach.
    // Without expectHead this returns ok:true and SAYS the tail is unproven, rather than implying a
    // completeness it cannot demonstrate.
    if (c.expectHead != null) {
      if (String(c.expectHead) !== prev) {
        return { ok: false, brokeAt: log.length, id: null, entries: log.length,
                 reason: 'the log ends earlier than it should — entries were removed from the end' };
      }
      return { ok: true, entries: log.length, tailProven: true,
               reason: 'every entry reproduces its own hash, and the log ends where it was expected to' };
    }

    return {
      ok: true, entries: log.length, tailProven: false,
      reason: log.length
        ? 'every entry reproduces its own hash — but nothing here can prove entries were not removed from the END; keep the head hash somewhere separate to close that'
        : 'the log is empty',
    };
  }

  return { append, verify, headOf, payloadOf };
}


// audit.mjs — fallhr's audit layout, and the chain built from it.
//
// ⚑ THE BYTES MUST NOT CHANGE. There are logs in the wild signed by the old inline writer. If this
// layout differs by one character, every entry a firm has already written stops reproducing and the
// verifier reports its whole history as tampered. Making a real audit trail look forged is a worse
// outcome than not checking it at all, so this is a faithful copy and audit.test.mjs pins it against
// the original formula.
//
// The chain semantics live in the shared, separately-gated audit-chain kernel. Only the byte layout
// is this repo's business.

function payloadOf(prevHash, entry, index) {
  const e = (entry && typeof entry === 'object') ? entry : {};
  // The original numbered entries from 1 and signed that number, so the index carried on the entry
  // is what must be hashed — not the position in the array.
  return JSON.stringify({ i: e.i, ts: e.ts, action: e.action, prevHash: String(prevHash == null ? '' : prevHash), payload: e.payload ?? {} });
}

/** The writer and the checker, from one call, over one layout — so they cannot drift apart. */
function makeAuditChain(sha256) {
  return auditChain({
    sha256,
    payloadOf: payloadOf,
    hashField: "docHash",
  });
}


/* __END_AUDIT_KERNEL__ */
return makeAuditChain(sha256);
})();
